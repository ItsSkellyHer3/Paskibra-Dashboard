{% extends "base.html" %}

{% block title_bar %}Edit Agenda{% endblock %}

{% block content %}
<div class="slide-up" style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 32px; text-align: center;">
        <div style="width: 72px; height: 72px; background: var(--md-sys-color-primary-container); border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; color: var(--md-sys-color-primary); margin-bottom: 16px;">
            <span class="material-symbols-outlined" style="font-size: 36px;">edit_calendar</span>
        </div>
        <h1 style="font-weight: 800; font-size: 2rem; margin: 0;">Edit Agenda</h1>
        <p style="color: var(--md-sys-color-on-surface-variant); margin-top: 8px;">Perbarui detail kegiatan atau ubah status pelaksanaan.</p>
    </div>

    <div class="card" style="background: var(--md-sys-color-surface); border-radius: 32px; padding: 32px; border: 1px solid var(--md-sys-color-outline-variant);">
        <form action="{{ url_for('schedule.edit', id=s.id) }}" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div style="grid-column: span 2;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Nama Kegiatan / Judul</label>
                    <input type="text" name="activity" value="{{ s.activity }}" required style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 20px; background: var(--md-sys-color-surface-container-low); font-size: 1rem;">
                </div>

                <div>
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Tanggal</label>
                    <input type="date" name="date" value="{{ s.date }}" required style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 20px; background: var(--md-sys-color-surface-container-low); font-family: inherit;">
                </div>

                <div>
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Waktu (WIB)</label>
                    <input type="time" name="time" value="{{ s.time }}" required style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 20px; background: var(--md-sys-color-surface-container-low); font-family: inherit;">
                </div>

                <div style="grid-column: span 2;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Lokasi Kegiatan</label>
                    <input type="text" name="location" value="{{ s.location }}" required style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 20px; background: var(--md-sys-color-surface-container-low);">
                </div>

                <div>
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Kategori</label>
                    <select name="category" style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 16px; background: var(--md-sys-color-surface-container-low); font-family: inherit;">
                        <option value="Latihan" {% if s.category == 'Latihan' %}selected{% endif %}>Latihan</option>
                        <option value="Upacara" {% if s.category == 'Upacara' %}selected{% endif %}>Upacara</option>
                        <option value="Rapat" {% if s.category == 'Rapat' %}selected{% endif %}>Rapat</option>
                        <option value="Lomba" {% if s.category == 'Lomba' %}selected{% endif %}>Lomba</option>
                        <option value="Sekolah" {% if s.category == 'Sekolah' %}selected{% endif %}>Sekolah</option>
                        <option value="Lainnya" {% if s.category == 'Lainnya' %}selected{% endif %}>Lainnya</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Status Pelaksanaan</label>
                    <select name="status" style="width: 100%; height: 56px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 0 16px; background: var(--md-sys-color-surface-container-low); font-family: inherit;">
                        <option value="Upcoming" {% if s.status == 'Upcoming' %}selected{% endif %}>Mendatang (Upcoming)</option>
                        <option value="Completed" {% if s.status == 'Completed' %}selected{% endif %}>Selesai (Completed)</option>
                        <option value="Postponed" {% if s.status == 'Postponed' %}selected{% endif %}>Ditunda (Postponed)</option>
                        <option value="Cancelled" {% if s.status == 'Cancelled' %}selected{% endif %}>Dibatalkan (Cancelled)</option>
                    </select>
                </div>

                <div style="grid-column: span 2;">
                    <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--md-sys-color-on-surface);">Deskripsi Tambahan (Opsional)</label>
                    <textarea name="description" style="width: 100%; min-height: 120px; border-radius: 16px; border: 1px solid var(--md-sys-color-outline-variant); padding: 16px; background: var(--md-sys-color-surface-container-low); font-family: inherit; font-size: 1rem;">{{ s.description or '' }}</textarea>
                </div>

                <div style="grid-column: span 2; padding: 16px; background: var(--md-sys-color-surface-container-highest); border-radius: 16px; display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" name="is_important" id="is_important" {% if s.is_important %}checked{% endif %} style="width: 24px; height: 24px; accent-color: var(--md-sys-color-error);">
                    <label for="is_important" style="font-weight: 700; color: var(--md-sys-color-on-surface); cursor: pointer;">Tandai sebagai Agenda Penting (Sorotan)</label>
                </div>
            </div>

            <div style="margin-top: 40px; display: flex; gap: 16px;">
                <button type="submit" class="btn btn-primary" style="flex: 2; height: 64px; border-radius: 20px;">
                    <span class="material-symbols-outlined">save</span>
                    <span>Simpan Perubahan</span>
                </button>
                <a href="{{ url_for('schedule.list') }}" class="btn btn-tonal" style="flex: 1; height: 64px; border-radius: 20px;">
                    <span>Batal</span>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
